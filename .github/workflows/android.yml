# Builds the Android app (apps/android) and runs its instrumented tests on an
# emulator. The debug APK is kept as an artifact for installing on a phone.
name: android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "30.0.16248370"
  SDK_CMAKE_VERSION: "4.1.2"

jobs:
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Use JDK 21 and install the NDK and CMake
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "cmake;$SDK_CMAKE_VERSION" "platforms;android-37.0" > /dev/null
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sillok-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Fetch a Korean speech recording for the end-to-end test
        working-directory: .
        run: |
          # FLEURS (google/fleurs, CC BY 4.0), as in scripts/fetch-test-audio.sh:
          # the first 48 MB of the Korean test audio, pinned and checked.
          curl -sfL -r 0-47999999 -o fleurs-ko.tar.gz \
            "https://huggingface.co/datasets/google/fleurs/resolve/70bb2e84b976b7e960aa89f1c648e09c59f894dd/data/ko_kr/audio/test.tar.gz"
          echo "9070bdc110da8ddc03d37e40371209fe117ddc7ea2b10d8b70a5aebcbf2b0a7a  fleurs-ko.tar.gz" | sha256sum -c
          python3 - <<'PY'
          import tarfile
          with tarfile.open("fleurs-ko.tar.gz", "r|gz") as archive:
              for member in archive:
                  if member.name.endswith(".wav"):
                      open("speech.wav", "wb").write(archive.extractfile(member).read())
                      break
          PY
          ls -l speech.wav
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          # The models need about 0.7 GB of storage and run in memory.
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          working-directory: apps/android
          script: |
            adb push ../../speech.wav /data/local/tmp/speech.wav
            ./gradlew connectedDebugAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.speech=/data/local/tmp/speech.wav || (grep -h -B1 -A8 "<failure" app/build/outputs/androidTest-results/connected/debug/*.xml; adb logcat -d -b crash; adb logcat -d | grep -E "AndroidRuntime|DEBUG|sillok|libc" | tail -300; exit 1)
            adb logcat -d -s sillok-test:I
            grep -ho '<testsuite name="[^"]*" tests="[0-9]*" failures="[0-9]*" errors="[0-9]*" skipped="[0-9]*"' app/build/outputs/androidTest-results/connected/debug/*.xml
