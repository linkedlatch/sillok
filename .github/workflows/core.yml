# Builds the core library and the command-line app, which run on more platforms
# than the Flutter app, and runs the model-free tests. The real-model
# integration tests skip here: CI has neither the models nor the recordings.
name: core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.4.4"
  NINJA_VERSION: "1.13.2"

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: windows-x64
            os: windows-2025
            msvc_arch: x64
          - name: windows-arm64
            os: windows-11-arm
            msvc_arch: arm64
            # MSVC proper can only target the build machine's own ARM features
            # (ggml-cpu CMakeLists); clang-cl takes an explicit baseline.
            compiler: clang-cl
            cmake_args: -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16
          - name: macos-arm64
            os: macos-15
            cmake_args: -DSILLOK_COREML=ON
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # The only one of NeMo-Speech.cpp's own submodules sillok uses.
      - name: Fetch NeMo's llama.cpp
        run: git -C third_party/NeMo-Speech.cpp submodule update --init --depth 1 llama.cpp
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: matrix.msvc_arch
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install CMake and Ninja
        run: scripts/ci/install-cmake.sh
      - name: Install make for FFmpeg's build (MSYS2)
        if: runner.os == 'Windows'
        run: |
          if [[ ! -x /c/msys64/usr/bin/pacman ]]; then
            choco install msys2 --no-progress -y --params "/NoUpdate /InstallDir:C:\msys64"
          fi
          /c/msys64/usr/bin/pacman -S --noconfirm --needed make diffutils
      - name: Configure
        run: |
          if [[ -n "${{ matrix.compiler }}" ]]; then
            command -v "${{ matrix.compiler }}" || export PATH="/c/Program Files/LLVM/bin:$PATH"
            export CC="${{ matrix.compiler }}" CXX="${{ matrix.compiler }}"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSILLOK_WERROR=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE integration
