# Builds the Windows app (apps/windows) with the library for x64 and its GPU
# backend (Vulkan), runs the .NET tests with the real models, and keeps the
# app folder as a zip that runs without installing anything.
name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.4.4"
  NINJA_VERSION: "1.13.2"
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  app:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
          cache: true
      - name: Install CMake and Ninja
        run: scripts/ci/install-cmake.sh
      - name: Build the library and the CLI (for the model download)
        run: |
          # The static C runtime spares users the Visual C++ redistributable.
          # GGML_NATIVE=OFF builds for AVX2 (CpuSupport in the app checks it)
          # rather than for the runner's CPU, which has AVX-512.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSILLOK_WERROR=ON \
            -DSILLOK_VULKAN=ON -DSILLOK_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DGGML_NATIVE=OFF
          cmake --build build --target sillok sillok_cli
          ls -l build/sillok.dll
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('src/backends/models.cpp') }}
      - name: Download the models and a Korean recording
        run: |
          # sillok.dll and the Vulkan loader it imports.
          export PATH="$PWD/build:$(cygpath -u "$VULKAN_SDK")/runtime/x64:$PATH"
          build/apps/cli/sillok.exe models download --models models
          # FLEURS (google/fleurs, CC BY 4.0), as in scripts/fetch-test-audio.sh.
          curl -sfL -r 0-47999999 -o fleurs-ko.tar.gz \
            "https://huggingface.co/datasets/google/fleurs/resolve/70bb2e84b976b7e960aa89f1c648e09c59f894dd/data/ko_kr/audio/test.tar.gz"
          echo "9070bdc110da8ddc03d37e40371209fe117ddc7ea2b10d8b70a5aebcbf2b0a7a  fleurs-ko.tar.gz" | sha256sum -c
          python - <<'PY'
          import tarfile
          with tarfile.open("fleurs-ko.tar.gz", "r|gz") as archive:
              for member in archive:
                  if member.name.endswith(".wav"):
                      open("speech.wav", "wb").write(archive.extractfile(member).read())
                      break
          PY
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - name: Test
        working-directory: apps/windows
        run: |
          # The Vulkan loader for a library built against it; the runner has no GPU.
          export PATH="$(cygpath -u "$VULKAN_SDK")/runtime/x64:$PATH"
          export SILLOK_NATIVE_DIR="$(cygpath -w "$GITHUB_WORKSPACE/build")"
          export SILLOK_MODELS="$(cygpath -w "$GITHUB_WORKSPACE/models")"
          export SILLOK_SPEECH="$(cygpath -w "$GITHUB_WORKSPACE/speech.wav")"
          dotnet test --project Sillok.Core.Tests -c Release
          dotnet test --project Sillok.Media.Tests -c Release
      - name: Build the app
        working-directory: apps/windows
        run: |
          dotnet publish Sillok.App/Sillok.App.csproj -c Release -r win-x64 -p:Platform=x64 \
            -p:SillokNativeDir="$(cygpath -w "$GITHUB_WORKSPACE/build")" -o "$GITHUB_WORKSPACE/out/Sillok"
          ls "$GITHUB_WORKSPACE/out/Sillok" | head -50
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sillok-windows-x64
          path: out/Sillok
          if-no-files-found: error
