# The Flutter app (apps/app). Its build hook builds the library for each
# target. The unit tests run on Linux; each platform's app is built with the
# library bundled and, where a runner can show it, started by the
# integration test. The tests that need the real models skip here.
name: app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.4.4"
  NINJA_VERSION: "1.13.2"
  FLUTTER_VERSION: "3.47.9"
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install CMake, Ninja and Flutter
        run: |
          scripts/ci/install-cmake.sh
          curl -sSfL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and test
        working-directory: apps/app
        run: |
          flutter --disable-analytics
          # The formatter reads the 120-column setting through
          # analysis_options.yaml, which includes a package.
          flutter pub get
          dart format --output=none --set-exit-if-changed lib/*.dart lib/data lib/engine lib/ui test integration_test hook
          flutter analyze
          flutter test

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
          cache: true
      - name: Install CMake, Ninja, make and Flutter
        run: |
          scripts/ci/install-cmake.sh
          /c/msys64/usr/bin/pacman -S --noconfirm --needed make diffutils
          # The build hook looks for the Vulkan SDK where its installer puts it.
          test -d "/c/VulkanSDK/${VULKAN_SDK_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/flutter.zip" "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_${FLUTTER_VERSION}-stable.zip"
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$(cygpath -w "$RUNNER_TEMP/flutter/bin")" >> "$GITHUB_PATH"
      - name: Test, then start the app
        working-directory: apps/app
        run: |
          flutter --disable-analytics
          flutter test
          flutter test integration_test/app_test.dart -d windows
      - name: Build the app
        working-directory: apps/app
        run: |
          flutter build windows
          cd build/windows/x64/runner/Release && 7z a -bso0 "$GITHUB_WORKSPACE/sillok-windows-x64.zip" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sillok-windows-x64
          path: sillok-windows-x64.zip

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install CMake, Ninja and Flutter
        run: |
          scripts/ci/install-cmake.sh
          # The app needs the macOS 26 SDK (docs/GUI-DESIGN.md G16).
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          curl -sSfL -o "$RUNNER_TEMP/flutter.zip" "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test, then start the macOS app
        working-directory: apps/app
        run: |
          flutter --disable-analytics
          flutter test
          flutter test integration_test/app_test.dart -d macos
      - name: Build the macOS app (unsigned)
        working-directory: apps/app
        run: |
          flutter build macos
          ditto -c -k --keepParent build/macos/Build/Products/Release/Sillok.app "$GITHUB_WORKSPACE/sillok-macos.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sillok-macos
          path: sillok-macos.zip
